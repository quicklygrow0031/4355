<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glimmer Jewels | Ultra Luxury Dark Theme</title>

    <!-- Google Fonts: Modern Luxury Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0B0B0E;         /* Ultra Deep Luxury Black */
            --card-bg: #15151A;        /* Premium Dark Card Background */
            --card-border: #23232C;    /* Subtle Metallic Border */
            --primary-gold: #E5C158;   /* Warm Gold Accent */
            --primary-pink: #E94057;   /* Pink Accent from Mockup */
            --text-white: #FFFFFF;
            --text-muted: #8E8E93;
            --badge-bg: rgba(0,0,0,0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-white);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 110px; /* Floating Bar Gap */
        }

        a { text-decoration: none; color: inherit; }

        /* Container Layout */
        .container {
            width: 100%;
            max-width: 480px; /* Mobile First Layout as in Mockup */
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Top Header */
        .app-header {
            background: rgba(11, 11, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 999;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text-white);
        }

        .app-logo span { color: var(--primary-gold); }

        .location-dropdown {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-icon-btn {
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-white);
            fill: none;
            stroke-width: 1.8;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -6px;
            background: var(--primary-pink);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stories / Categories Feed (Instagram Style) */
        .stories-section {
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stories-wrapper {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .stories-wrapper::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            min-width: 68px;
        }

        .story-ring {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, var(--primary-gold), #8A6E2F);
            position: relative;
        }

        .story-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-main);
        }

        .story-label {
            font-size: 11px;
            color: #C5C5D0;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
        }

        /* Product Feed Section */
        .feed-section {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Dark Product Card (From Poster Image UI) */
        .feed-card {
            background-color: var(--card-bg);
            border-radius: 18px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .seller-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .seller-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(229, 193, 88, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(229, 193, 88, 0.4);
        }

        .seller-avatar svg {
            width: 16px;
            height: 16px;
            stroke: var(--primary-gold);
            fill: none;
            stroke-width: 2;
        }

        .seller-details h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-white);
        }

        .seller-details p {
            font-size: 10px;
            color: var(--text-muted);
        }

        .more-btn {
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Main Image Box */
        .card-img-box {
            position: relative;
            width: 100%;
            height: 320px;
            background-color: #000;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-count-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--badge-bg);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-white);
        }

        /* Card Content & Action Buttons */
        .card-body {
            padding: 16px;
        }

        .product-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-white);
        }

        .price-rating-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .price-tag {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-white);
        }

        .rating-box {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-gold);
        }

        .rating-box svg {
            width: 13px;
            height: 13px;
            fill: var(--primary-gold);
        }

        .rating-count {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Dual Action Buttons (Add to Cart / Buy Now) */
        .card-actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-white);
            fill: none;
            stroke-width: 2;
        }

        .btn-solid {
            background: var(--primary-gold);
            border: none;
            color: #000000;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-solid:active, .btn-outline:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <!-- App Header -->
    <header class="app-header">
        <div class="container">
            <div class="header-content">
                <div class="brand-section">
                    <a href="#" class="app-logo"><span>Glimmer</span>Jewels</a>
                </div>
                <div class="header-actions">
                    <!-- Search Icon SVG -->
                    <div class="header-icon-btn">
                        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <!-- Wishlist Icon SVG -->
                    <div class="header-icon-btn">
                        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </div>
                    <!-- Cart Icon SVG -->
                    <div class="header-icon-btn">
                        <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                        <span class="cart-badge">3</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Stories / Categories Section -->
        <section class="stories-section">
            <div class="stories-wrapper">
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://i.pinimg.com/736x/a5/45/a6/a545a632bda33c53b98dfe6eeaa6335b.jpg" alt="Hampers">
                    </div>
                    <span class="story-label">Hampers</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://img.staticdj.com/ef5dc5e3d5f8737162e7d1546c23957b_1280x.jpg" alt="Bracelets">
                    </div>
                    <span class="story-label">Bracelets</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://i.pinimg.com/1200x/01/8e/27/018e2769c03f37e1450842f45f368b53.jpg" alt="Rings">
                    </div>
                    <span class="story-label">Rings</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://i.pinimg.com/1200x/77/b4/0d/77b40d82a7558902816d326ac344cf1b.jpg" alt="Pendants">
                    </div>
                    <span class="story-label">Pendants</span>
                </div>
                <div class="story-item">
                    <div class="story-ring">
                        <img src="https://i.pinimg.com/736x/07/68/b8/0768b8ca50f65479658ba5f54384a459.jpg" alt="Best Seller">
                    </div>
                    <span class="story-label">Best Seller</span>
                </div>
            </div>
        </section>

        <!-- Product Feed Section -->
        <section class="feed-section">

            <!-- Card 1 -->
            <article class="feed-card">
                <div class="card-header">
                    <div class="seller-info">
                        <div class="seller-avatar">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </div>
                        <div class="seller-details">
                            <h4>Glimmer Jewels</h4>
                            <p>Premium Collection</p>
                        </div>
                    </div>
                    <div class="more-btn">•••</div>
                </div>

                <div class="card-img-box">
                    <span class="image-count-badge">1/4</span>
                    <img src="https://i.pinimg.com/736x/a5/45/a6/a545a632bda33c53b98dfe6eeaa6335b.jpg" alt="Luxury Self Love Hamper">
                </div>

                <div class="card-body">
                    <h3 class="product-title">Luxury Self Love Hamper</h3>
                    <div class="price-rating-row">
                        <span class="price-tag">₹1,999</span>
                        <div class="rating-box">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <span>4.8</span>
                            <span class="rating-count">(256)</span>
                        </div>
                    </div>
                    <div class="card-actions-grid">
                        <button class="btn-outline">
                            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                            Add to Cart
                        </button>
                        <button class="btn-solid">Buy Now</button>
                    </div>
                </div>
            </article>

            <!-- Card 2 -->
            <article class="feed-card">
                <div class="card-header">
                    <div class="seller-info">
                        <div class="seller-avatar">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </div>
                        <div class="seller-details">
                            <h4>Glimmer Jewels</h4>
                            <p>Exclusive Release</p>
                        </div>
                    </div>
                    <div class="more-btn">•••</div>
                </div>

                <div class="card-img-box">
                    <span class="image-count-badge">1/4</span>
                    <img src="https://img.staticdj.com/ef5dc5e3d5f8737162e7d1546c23957b_1280x.jpg" alt="Rose Gold Charm Bracelet">
                </div>

                <div class="card-body">
                    <h3 class="product-title">Rose Gold Charm Bracelet</h3>
                    <div class="price-rating-row">
                        <span class="price-tag">₹1,499</span>
                        <div class="rating-box">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <span>4.7</span>
                            <span class="rating-count">(182)</span>
                        </div>
                    </div>
                    <div class="card-actions-grid">
                        <button class="btn-outline">
                            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                            Add to Cart
                        </button>
                        <button class="btn-solid">Buy Now</button>
                    </div>
                </div>
            </article>

        </section>

    </main>

    <!-- Floating SVG Bottom Navigation Bar -->
    <luxury-bottom-bar></luxury-bottom-bar>

    <script>
      class LuxuryBottomBar extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });

          this.shadowRoot.innerHTML = `
            <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

            <style>
              :host {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 999999;
                pointer-events: none;
              }

              .boxes-container {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
              }

              .nav-box {
                pointer-events: auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-decoration: none;
                width: 58px;
                height: 58px;
                border-radius: 18px;
                background: rgba(18, 18, 22, 0.85);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.1);
                color: #8E8E93;
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
                transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
                cursor: pointer;
              }

              .nav-box svg {
                width: 20px;
                height: 20px;
                stroke: #8E8E93;
                fill: none;
                stroke-width: 1.8;
                stroke-linecap: round;
                stroke-linejoin: round;
                transition: all 0.3s ease;
                margin-bottom: 3px;
              }

              .nav-box span {
                font-family: 'Plus Jakarta Sans', sans-serif;
                font-size: 8.5px;
                font-weight: 600;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                color: #8E8E93;
                transition: all 0.3s ease;
              }

              /* Home Active State */
              .nav-box.draft-active {
                background: linear-gradient(145deg, rgba(229, 193, 88, 0.2), rgba(20, 20, 25, 0.95));
                border: 1px solid rgba(229, 193, 88, 0.6);
                box-shadow: 0 12px 25px rgba(0, 0, 0, 0.7),
                            0 0 15px rgba(229, 193, 88, 0.25);
                transform: translateY(-3px);
              }

              .nav-box.draft-active svg {
                stroke: #E5C158;
                filter: drop-shadow(0 0 4px rgba(229, 193, 88, 0.5));
              }

              .nav-box.draft-active span {
                color: #FFFFFF;
                font-weight: 700;
              }

              .nav-box:hover:not(.draft-active) {
                background: rgba(32, 32, 38, 0.9);
                border-color: rgba(255, 255, 255, 0.2);
              }

              .nav-box:hover:not(.draft-active) svg {
                stroke: #FFFFFF;
              }
            </style>

            <div class="boxes-container">
              <a href="#" class="nav-box draft-active">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                <span>Home</span>
              </a>

              <a href="#" class="nav-box">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                <span>Categories</span>
              </a>

              <a href="#" class="nav-box">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                <span>Saved</span>
              </a>

              <a href="#" class="nav-box">
                <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                <span>Cart</span>
              </a>

              <a href="#" class="nav-box">
                <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <span>Profile</span>
              </a>
            </div>
          `;

          const boxes = this.shadowRoot.querySelectorAll('.nav-box');
          boxes.forEach(box => {
            box.addEventListener('click', (e) => {
              e.preventDefault();
              boxes.forEach(b => b.classList.remove('draft-active'));
              box.classList.add('draft-active');
            });
          });
        }
      }

      customElements.define('luxury-bottom-bar', LuxuryBottomBar);
    </script>

</body>
</html>
